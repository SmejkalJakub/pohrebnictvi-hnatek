<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Pohřebnictví Hnátek — integrační ukázka</title>
<link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/hnatek-icon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../icons/hnatek-icon-16x16.png">
<link rel="shortcut icon" href="../icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest"><link rel="stylesheet" href="hnatek-tokens.css">
<style>body{margin:0;background:var(--hnatek-ivory);color:var(--hnatek-green);font:18px system-ui,sans-serif}.hero{max-width:1100px;margin:auto;padding:48px 24px}header{padding:24px 0;border-bottom:1px solid #d9d6ce}header img{max-width:min(700px,100%);height:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:40px}.card{padding:28px;border:1px solid #ddd9d0;background:white;display:grid;justify-items:center}.card img{max-width:100%;max-height:300px}.card.dark{background:var(--hnatek-green)}.card strong{color:var(--hnatek-green)}.card.dark strong{color:white}</style></head>
<body><main class="hero"><header><img src="../logos/svg/hnatek-primary-horizontal.svg" alt="Pohřebnictví Hnátek Vyškov"></header>
<h1>Ukázka použití loga</h1><p>Pro navigaci doporučujeme horizontální SVG. Pro malé ikony používejte zjednodušenou verzi.</p>
<div class="cards"><div class="card"><img src="../logos/svg/hnatek-primary-stacked.svg" alt="Vertikální logo"><strong>Hlavní logo</strong></div>
<div class="card"><img src="../logos/svg/hnatek-symbol.svg" alt="Znak Hnátek"><strong>Samostatný znak</strong></div>
<div class="card dark"><img src="../logos/svg/hnatek-horizontal-white.svg" alt="Světlé horizontální logo"><strong>Reverzní varianta</strong></div>
<div class="card"><img src="../icons/hnatek-icon-app.svg" width="170" height="170" alt="Ikona Hnátek"><strong>Favicon / ikona</strong></div></div>
</main></body></html>
